server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects relative. Traefik terminates TLS in front of this
    # container, so an absolute redirect built from nginx's own view would
    # advertise the wrong scheme and port.
    absolute_redirect off;

    # Serve the home page directly. Deliberately not using `index index.html`:
    # that issues an internal redirect to /index.html, which would then match
    # the extensionless rule below and bounce / to /index.
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    # Serve Google site verification HTML files directly without 301 redirects
    location ~ ^/google[a-z0-9]+\.html$ {
        try_files $uri =404;
    }

    # Send /privacy.html to /privacy so only one form of each URL is canonical
    # and search engines don't index both.
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # The policies used to sit at the top level. Anything already pointing at
    # the old flat paths keeps working, and only /legal/... is canonical.
    # data-deletion was never top-level, but the short form is easy to type into
    # a console by mistake and a 404 on the URL registered with Meta is a Live
    # -mode blocker, so it redirects rather than 404s.
    location ~ ^/(privacy|terms|returns|shipping|cancellation|data-deletion)$ {
        return 301 /legal/$1;
    }

    # The app links to /privacy, /terms, /returns, /shipping and /cancellation
    # without a file extension, and those URLs are compiled into shipped app
    # builds — they cannot change later. This is what maps them onto the .html
    # files on disk, so it is load-bearing, not a nicety.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Images and CSS are cached for a day only. The stylesheet link carries a
    # ?v= string that is bumped when it changes, so a redeploy is picked up
    # immediately rather than after a cache expires — which matters while the
    # client is reviewing and the pages are still moving.
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Fonts are immutable once shipped and are requested on every page.
    location /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        types { font/ttf ttf; }
        default_type font/ttf;
    }

    gzip on;
    gzip_types text/plain text/css text/html application/javascript image/svg+xml
               font/ttf application/font-sfnt;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # TEMPORARY, remove together with robots.txt once the [[PLACEHOLDER]] values
    # are filled in. The pages have to be publicly reachable for App Review and
    # for the links inside the app, but an unfinished privacy policy carrying the
    # client's brand should not end up in a search index or a crawler's cache.
    # The header covers crawlers that never request robots.txt.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Health endpoint for Coolify's container check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
